<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="105" viewBox="0 0 1200 105" role="img" aria-labelledby="title desc">
  <title id="title">Profile identity signal</title>
  <desc id="desc">Active status, Guangzhou location, experience since 2014, and UTC plus eight local time.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090e"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <radialGradient id="glow" cx="92%" cy="4%" r="75%">
      <stop offset="0" stop-color="#57dfff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#57dfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#57dfff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="105" rx="12" fill="url(#background)"/>
  <rect width="1200" height="105" rx="12" fill="url(#glow)"/>
  <rect width="1200" height="105" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="103" rx="11" fill="none" stroke="#1b5364" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="28" y="37" fill="#7796a3" font-size="11" font-weight="700" letter-spacing="2">STATUS</text>
    <text x="28" y="70" fill="#6cf2a8" font-size="17" font-weight="700">● ACTIVE</text>
    <path d="M300 18V87" stroke="#1b5364"/>
    <text x="328" y="37" fill="#7796a3" font-size="11" font-weight="700" letter-spacing="2">BASE</text>
    <text x="328" y="70" fill="#edfaff" font-size="17" font-weight="700">GUANGZHOU, CN</text>
    <path d="M600 18V87" stroke="#1b5364"/>
    <text x="628" y="37" fill="#7796a3" font-size="11" font-weight="700" letter-spacing="2">EXPERIENCE</text>
    <text x="628" y="70" fill="#edfaff" font-size="17" font-weight="700">2014 — PRESENT</text>
    <path d="M900 18V87" stroke="#1b5364"/>
    <text x="928" y="37" fill="#7796a3" font-size="11" font-weight="700" letter-spacing="2">LOCAL TIME</text>
    <text x="928" y="70" fill="#edfaff" font-size="17" font-weight="700">UTC+08:00</text>
  </g>
</svg>
