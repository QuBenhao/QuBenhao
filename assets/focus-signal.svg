<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-labelledby="title desc">
  <title id="title">Current engineering focus</title>
  <desc id="desc">Animated command line cycling through distributed systems, AI tooling, and reliable engineering.</desc>

  <defs>
    <linearGradient id="signal-background" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070c11"/>
      <stop offset="0.52" stop-color="#09141b"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <linearGradient id="signal-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57dfff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#57dfff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#57dfff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .line-1 { animation: line-1 12s ease-in-out infinite; }
      .line-2 { animation: line-2 12s ease-in-out infinite; }
      .line-3 { animation: line-3 12s ease-in-out infinite; }
      .cursor { animation: cursor 800ms step-end infinite; }
      .signal-rule { animation: rule-pulse 3s ease-in-out infinite; }
      @keyframes line-1 {
        0%, 28% { opacity: 1; transform: translateY(0); }
        32%, 96% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes line-2 {
        0%, 31% { opacity: 0; transform: translateY(4px); }
        35%, 61% { opacity: 1; transform: translateY(0); }
        65%, 100% { opacity: 0; transform: translateY(4px); }
      }
      @keyframes line-3 {
        0%, 64% { opacity: 0; transform: translateY(4px); }
        68%, 94% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; transform: translateY(4px); }
      }
      @keyframes cursor { 50% { opacity: 0; } }
      @keyframes rule-pulse {
        0%, 100% { opacity: .24; }
        50% { opacity: .75; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line-1 { animation: none; opacity: 1; }
        .line-2, .line-3 { display: none; }
        .cursor, .signal-rule { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="80" rx="12" fill="url(#signal-background)"/>
  <rect x="1" y="1" width="1198" height="78" rx="11" fill="none" stroke="#263943" stroke-width="2"/>
  <rect class="signal-rule" x="890" y="39" width="240" height="2" fill="url(#signal-rule)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="28" y="49" fill="#6cf2a8" font-weight="700">&gt;</text>
    <text class="line-1" x="55" y="49" fill="#b9d6de">designing distributed systems that stay understandable<tspan class="cursor" fill="#6cf2a8">_</tspan></text>
    <text class="line-2" x="55" y="49" fill="#b9d6de" opacity="0">building AI tools for real developer workflows<tspan class="cursor" fill="#6cf2a8">_</tspan></text>
    <text class="line-3" x="55" y="49" fill="#b9d6de" opacity="0">turning difficult problems into reliable systems<tspan class="cursor" fill="#6cf2a8">_</tspan></text>
    <text x="1168" y="49" fill="#5b7782" font-size="12" text-anchor="end" letter-spacing="2">FOCUS // LIVE</text>
  </g>
</svg>
