<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="104" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc">
  <title id="title">Profile footer</title>
  <desc id="desc">The best code solves the problem elegantly. Guangzhou, China, UTC plus eight, open to interesting collaborations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05090e"/>
      <stop offset="1" stop-color="#07151d"/>
    </linearGradient>
    <radialGradient id="glow" cx="92%" cy="4%" r="75%">
      <stop offset="0" stop-color="#57dfff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#57dfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#57dfff" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="104" rx="12" fill="url(#background)"/>
  <rect width="1200" height="104" rx="12" fill="url(#glow)"/>
  <rect width="1200" height="104" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="102" rx="11" fill="none" stroke="#1b5364" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="600" y="43" fill="#b9d6de" font-size="17" text-anchor="middle">“The best code solves the problem elegantly.”</text>
    <text x="600" y="76" fill="#7796a3" font-size="11" text-anchor="middle" letter-spacing="2">GUANGZHOU, CN · UTC+08:00 · OPEN TO INTERESTING COLLABORATIONS</text>
  </g>
</svg>
